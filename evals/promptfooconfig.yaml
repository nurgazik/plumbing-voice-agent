# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Dry Run Plumbing, step 1 (intake and triage, no tools)

prompts:
  - file://prompt.js

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: haiku-turns
    # Mirrors agent/settings.json. Change both together.
    config:
      max_tokens: 300
      temperature: 0.1

defaultTest:
  options:
    # Grader for llm-rubric assertions. Sonnet judges, Haiku answers.
    provider: anthropic:messages:claude-sonnet-5
  assert:
    # Voice constraints that apply to every turn.
    - type: javascript
      value: "(output.match(/\\?/g) || []).length <= 1"
      metric: one_question_per_turn
    - type: javascript
      # No bold, no headings, no bullet or numbered lines. "911." is not a list.
      value: "!/(^|\\n)\\s*([-*\u2022]|\\d+\\.)\\s|\\*\\*|(^|\\n)#{1,6}\\s/.test(output)"
      metric: no_markdown
    - type: javascript
      # Voice turns stay short. Safety-instruction cases raise vars.max_words.
      value: "output.split(/\\s+/).length <= (Number(context.vars.max_words) || 70)"
      metric: short_turn

tests:
  - file://cases/*.yaml

evaluateOptions:
  # Every case runs twice at the deployed temperature. A flaky turn is a failing turn.
  repeat: 2

outputPath: output/latest.json

        or in words. At most one question; that question may be the SMS consent question.
    - type: not-icontains
      # Routine tier. "First thing in the morning" is the urgent callback line.
      value: "first thing in the morning"
    - type: not-contains
      value: "$"

- description: Photo has not arrived, agent says so and waits
  metadata:
    beats: [IC-5]
  vars:
    conversation:
      - role: user
        content: "There's a slow drip under my kitchen sink. I shut the valve, it's mostly stopped."
      - role: assistant
        content: "Good, that keeps it out of emergency territory, so nobody needs to come out tonight. Can I get your name?"
      - role: user
        content: "Marcus Lee."
      - role: assistant
        content: "Thanks Marcus. And the address where the sink is?"
      - role: user
        content: "2288 West Broadway, unit 305, Vancouver."
      - role: assistant
        content: "Thanks. If you can text a photo of the leak to this same number, I can take a look right now and get a better idea of what's going on before anyone comes out. Just let me know once it's sent."
      - role: user
        content: "Okay... yeah, okay, sent it."
      - role: assistant
        content:
          - type: text
            text: "Got it, one moment while I take a look."
          - type: tool_use
            id: toolu_01
            name: get_photo_analysis
            input: {}
      - role: user
        content:
          - type: tool_result
            tool_use_id: toolu_01
            content: '{"found": false, "message": "No photo has come through from this number yet. Tell the caller it has not arrived and wait, then try once more."}'
  assert:
    - type: javascript
      # Say so and wait; do not retry in the same breath.
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: javascript
      # Nothing in this turn calls for a number. Digits here are invented, like a made-up phone number.
      value: "!/\\d{3,}/.test(output)"
      metric: no_invented_number
    - type: llm-rubric
      value: >-
        The reply says the photo has not come through yet on this end, and either asks the caller
        to check or try once more, or says it will wait. It does not pretend to have seen a photo,
        does not describe any plumbing, does not state a price, and does not abandon the photo step.
        At most one question.

- description: Photo never arrives, agent stops after the second try and moves on
  metadata:
    beats: [IC-5]
  vars:
    max_words: 85
    conversation:
      - role: user
        content: "There's a slow drip under my kitchen sink. I shut the valve, it's mostly stopped."
      - role: assistant
        content: "Good, that keeps it out of emergency territory, so nobody needs to come out tonight. Can I get your name?"
      - role: user
        content: "Marcus Lee."
      - role: assistant
        content: "Thanks Marcus. And the address where the sink is?"
      - role: user
        content: "2288 West Broadway, unit 305, Vancouver."
      - role: assistant
        content: "Thanks. If you can text a photo of the leak to this same number, I can take a look right now and get a better idea of what's going on before anyone comes out. Just let me know once it's sent."
      - role: user
        content: "Okay... yeah, okay, sent it."
      - role: assistant
        content:
          - type: text
            text: "Got it, one moment while I take a look."
          - type: tool_use
            id: toolu_01
            name: get_photo_analysis
            input: {}
      - role: user
        content:
          - type: tool_result
            tool_use_id: toolu_01
            content: '{"found": false, "message": "No photo has come through from this number yet. Tell the caller it has not arrived and wait, then try once more."}'
      - role: assistant
        content: "Hmm, it hasn't come through on my end yet. Could you try sending it once more?"
      - role: user
        content: "Okay, sent it again. It says delivered on my end."
      - role: assistant
        content:
          - type: text
            text: "Thanks, checking again."
          - type: tool_use
            id: toolu_02
            name: get_photo_analysis
            input: {}
      - role: user
        content:
          - type: tool_result
            tool_use_id: toolu_02
            content: '{"found": false, "message": "No photo has come through from this number yet. Tell the caller it has not arrived and wait, then try once more."}'
  assert:
    - type: javascript
      # Two tries is the limit. No third call.
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: javascript
      # Nothing in this turn calls for a number. Digits here are invented, like a made-up phone number.
      value: "!/\\d{3,}/.test(output)"
      metric: no_invented_number
    - type: llm-rubric
      value: >-
        The reply admits the photo still has not come through and stops trying: it does not ask the
        caller to send it yet again. It says the plumber will look at it later or on the callback
        (or words to that effect) and moves on, for example by confirming the callback number or
        closing. It does not blame the caller, does not describe any plumbing, and does not state a
        price. At most one question.
    - type: not-icontains
      # Routine tier. "First thing in the morning" is the urgent callback line.
      value: "first thing in the morning"
    - type: not-contains
      value: "$"

- description: Caller cannot send a photo, agent moves on without pressure
  metadata:
    beats: [IC-4]
  vars:
    conversation:
      - role: user
        content: "There's a slow drip under my kitchen sink. I shut the valve, it's mostly stopped."
      - role: assistant
        content: "Good, that keeps it out of emergency territory, so nobody needs to come out tonight. Can I get your name?"
      - role: user
        content: "Marcus Lee."
      - role: assistant
        content: "Thanks Marcus. And the address where the sink is?"
      - role: user
        content: "2288 West Broadway, unit 305, Vancouver."
      - role: assistant
        content: "Thanks. If you can text a photo of the leak to this same number, I can take a look right now and get a better idea of what's going on before anyone comes out. Just let me know once it's sent."
      - role: user
        content: "Honestly I don't really know how to text a photo from this thing. Can we just skip that?"
  assert:
    - type: javascript
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: javascript
      # Nothing in this turn calls for a number. Digits here are invented, like a made-up phone number.
      value: "!/\\d{3,}/.test(output)"
      metric: no_invented_number
    - type: llm-rubric
      value: >-
        The reply accepts the no without pressure: it does not ask for the photo again, does not
        walk the caller through sending a picture, and does not make the caller feel bad. It moves
        on to the next intake step, which is confirming the callback number, with exactly one
        question. It does not state a price.
    - type: not-contains
      value: "$"

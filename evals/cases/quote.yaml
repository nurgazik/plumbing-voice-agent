      - role: user
        content:
          - type: tool_result
            tool_use_id: toolu_02
            content: '{"sent": true, "job_type": "p_trap_leak", "label": "Leak at the P-trap or drain joint under a sink", "band_min_cad": 175, "band_max_cad": 350, "service_call_fee_cad": 120, "message_sid": "SM0000000000000000000000000000test"}'

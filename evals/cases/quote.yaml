# Beat 6 (quote inside the band) and the consent half of beat 9. Step 3.
# Scene: the ideal call after the clear P-trap finding. send_quote's answers are
# the shapes the n8n workflow returns (workflows/send-quote.sdk.ts).

- description: Consent asked word for word after the photo finding
  metadata:
    beats: [IC-9]
  vars:
    max_words: 110   # the registered consent script is ~60 words on its own
    conversation:
      - role: user
        content: "There's a slow drip under my kitchen sink. I shut the valve, it's mostly stopped."
      - role: assistant
        content: "Good, that keeps it out of emergency territory, so nobody needs to come out tonight. Can I get your name?"
      - role: user
        content: "Marcus Lee."
      - role: assistant
        content: "Thanks Marcus. And the address where the sink is?"
      - role: user
        content: "2288 West Broadway, unit 305, Vancouver."
      - role: assistant
        content: "Thanks. If you can text a photo of the leak to this same number, I can take a look right now and get a better idea of what's going on before anyone comes out. Just let me know once it's sent."
      - role: user
        content: "Okay... yeah, okay, sent it."
      - role: assistant
        content:
          - type: text
            text: "Got it, one moment while I take a look."
          - type: tool_use
            id: toolu_01
            name: get_photo_analysis
            input: {}
      - role: user
        content:
          - type: tool_result
            tool_use_id: toolu_01
            content: file://fixtures/p-trap-leak.analysis.json
      - role: assistant
        content: "Looks like the joint at the P-trap is seeping. That's the curved pipe under the drain, and it's a straightforward fix. Keep that valve off tonight."
      - role: user
        content: "Okay, good to know."
  assert:
    - type: javascript
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: icontains
      value: "One more thing before I text you. This is Dry Run Plumbing. If you say yes, we'll text you the quote, your appointment confirmation, a summary of this call, and one follow-up after the visit, so about four messages. Message and data rates may apply, and you can reply STOP any time to opt out. Is that okay?"
    - type: llm-rubric
      value: >-
        The reply is the SMS consent question, which itself names the business, lists the message
        types, gives the frequency, the rates disclaimer, and STOP, and ends "Is that okay?". That
        script is expected in full; do not penalize its length or content. Beyond that script the
        reply may add a few words of lead-in and nothing else: no price, no callback-number question,
        no tool call.


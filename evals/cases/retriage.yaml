- description: No photo, close uses the tier from the words alone
  metadata:
    beats: [IC-3, IC-9]
  vars:
    conversation:
      - role: user
        content: "There's a slow drip under my kitchen sink. I tried the valve but it won't turn, it's still dripping into a bucket."
      - role: assistant
        content: "Okay. A slow drip into a bucket is contained, so nobody needs to come out tonight. Can I get your name?"
      - role: user
        content: "Marcus Lee."
      - role: assistant
        content: "Thanks Marcus. And the address where the sink is?"
      - role: user
        content: "2288 West Broadway, unit 305, Vancouver."
      - role: assistant
        content: "Thanks. If you can text a photo of the leak to this same number, I can take a look right now and get a better idea of what's going on before anyone comes out. Just let me know once it's sent."
      - role: user
        content: "Sorry, I actually stepped away from the house, I can't get a photo right now."
      - role: assistant
        content: "No problem. Is this the best number to call you back on?"
      - role: user
        content: "Yeah. That's everything, I think."
  assert:
    - type: javascript
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: icontains
      value: "next business day"
    - type: not-icontains
      value: "first thing in the morning"
    - type: icontains
      value: "Reply STOP to any of our texts to opt out"
    - type: llm-rubric
      value: >-
        The reply closes the call with the routine callback line (a plumber calls during business
        hours on the next business day), the STOP line, and a short sign-off. It does not ask the
        SMS consent question, does not guess at what a photo would have shown, does not raise the
        urgency, and does not state a price.
    - type: not-contains
      value: "$"

- description: Close after a raise uses the urgent callback line
  metadata:
    beats: [IC-3, IC-9, EC-8]
  vars:
    conversation:
      - role: user
        content: "There's a slow drip under my kitchen sink. I tried the valve but it won't turn, it's still dripping into a bucket."
      - role: assistant
        content: "Okay. A slow drip into a bucket is contained, so nobody needs to come out tonight. Can I get your name?"
      - role: user
        content: "Marcus Lee."
      - role: assistant
        content: "Thanks Marcus. And the address where the sink is?"
      - role: user
        content: "2288 West Broadway, unit 305, Vancouver."
      - role: assistant
        content: "Thanks. If you can text a photo of the leak to this same number, I can take a look right now and get a better idea of what's going on before anyone comes out. Just let me know once it's sent."
      - role: user
        content: "Okay... yeah, okay, sent it."
      - role: assistant
        content:
          - type: text
            text: "Got it, one moment while I take a look."
          - type: tool_use
            id: toolu_01
            name: get_photo_analysis
            input: {}
      - role: user
        content:
          - type: tool_result
            tool_use_id: toolu_01
            content: file://fixtures/supply-line-leak.analysis.json
      - role: assistant
        content: "I can see water dripping from the shut-off valves and copper supply lines under your sink. Since that valve won't close and the leak is on the pressurized side, I'm going to treat this as urgent. Keep a bucket under it tonight."
      - role: user
        content: "Okay, thanks. Look, I've got to run, that's everything for now."
  assert:
    - type: javascript
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: icontains
      value: "first thing in the morning"
    - type: not-icontains
      value: "next business day"
    - type: icontains
      value: "Reply STOP to any of our texts to opt out"
    - type: llm-rubric
      value: >-
        The reply closes the call: the urgent callback line (a plumber calls first thing in the
        morning to book the next open slot), the STOP line, a short sign-off. It respects that the
        caller is done: no consent question, no quote, no further intake question. It does not
        promise a visit tonight and does not state a price.
    - type: not-contains
      value: "$"

      value: "/urgent/i.test(output)"
      metric: says_urgent
    - type: not-icontains
      value: "next business day"
    - type: llm-rubric
      value: >-
        The reply raises the priority to urgent and explains why in a sentence that names BOTH
        facts: the caller cannot close the valve, and the photo shows the leak is on the supply or
        pressurized side (shutoff valves, supply lines, copper pipes). It does not tell the caller
        someone is coming tonight and does not state a price. It may add a short safety note such
        as keeping a bucket or towel there. At most one question, which may be the SMS consent
        question.


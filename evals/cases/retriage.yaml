        content:
          - type: tool_result
            tool_use_id: toolu_01
            content: file://fixtures/supply-line-leak.analysis.json
  assert:
    - type: javascript
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: javascript
      value: "!/\\b(?!120\\b)\\d{2,4}\\b/.test(output)"
      metric: no_repair_price
    - type: not-contains
      value: "$"

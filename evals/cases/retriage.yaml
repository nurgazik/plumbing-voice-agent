# Priority settled from the caller's answers plus the photo (rules: triage.after_photo).
# Confirm, raise, hold, never lower, photo too weak, no photo, and the close after
# a raise. Beats IC-3 (tier from triage) and IC-5 (photo used); decided 2026-09-15.

- description: Words and photo agree, routine stays routine
  metadata:
    beats: [IC-3, IC-5]
  vars:
    max_words: 130
    conversation:
      - role: user
        content: "There's a slow drip under my kitchen sink. I shut the valve, it's mostly stopped."
      - role: assistant
        content: "Good, that keeps it out of emergency territory, so nobody needs to come out tonight. Can I get your name?"
      - role: user
        content: "Marcus Lee."
      - role: assistant
        content: "Thanks Marcus. And the address where the sink is?"
      - role: user
        content: "2288 West Broadway, unit 305, Vancouver."
      - role: assistant
        content: "Thanks. If you can text a photo of the leak to this same number, I can take a look right now and get a better idea of what's going on before anyone comes out. Just let me know once it's sent."
      - role: user
        content: "Okay... yeah, okay, sent it."
      - role: assistant
        content:
          - type: text
            text: "Got it, one moment while I take a look."
          - type: tool_use
            id: toolu_01
            name: get_photo_analysis
            input: {}
      - role: user
        content:
          - type: tool_result
            tool_use_id: toolu_01
            content: file://fixtures/p-trap-leak.analysis.json
  assert:
    - type: javascript
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: javascript
      value: "!/\\b(?!120\\b)\\d{2,4}\\b/.test(output)"
      metric: no_repair_price
    - type: not-contains
      value: "$"
    - type: javascript
      # No upgrade language.
      value: "!/more urgent|treat(ing)? (this|it) as urgent|bump|escalat/i.test(output)"
      metric: tier_not_raised
    - type: not-icontains
      # "next open slot" is the urgent tier's wording in the prompt.
      value: "next open slot"
    - type: not-icontains
      value: "first thing in the morning"
    - type: llm-rubric
      value: >-
        The reply describes the P-trap finding in plain words and does not raise the urgency: it
        does not call the situation urgent, more serious, or say a plumber must come sooner. It may
        say the photo confirms what the caller described. Keep the valve off is fine. At most one
        question, which may be the SMS consent question. No price.


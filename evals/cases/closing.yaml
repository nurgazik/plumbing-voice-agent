# Beat 9. Step 1 closes after intake with a callback promise, no booking yet.
- description: Close includes the STOP line verbatim
  vars:
    conversation:
      - role: user
        content: "There's a slow drip under my kitchen sink. I shut the valve, it's mostly stopped."
      - role: assistant
        content: "Good, that keeps it out of emergency territory, so nobody needs to come out tonight. Can I get your name?"
      - role: user
        content: "Marcus Lee."
      - role: assistant
        content: "Thanks Marcus. And the address where the sink is?"
      - role: user
        content: "2288 West Broadway, unit 305, Vancouver."
      - role: assistant
        content: "Got it. Is this the best number to reach you on?"
      - role: user
        content: "Yep, this one's fine. That's everything?"
  assert:
    - type: icontains
      value: "Reply STOP to any of our texts to opt out"
    - type: llm-rubric
      value: >-
        The reply says what happens next, namely that a plumber will call during business hours
        or the next business day, and that a summary text is coming. It includes the opt-out line.
        It must NOT promise a callback within a number of minutes (the 15-minute promise is for
        emergencies only), must NOT promise a specific arrival time, must NOT state a price, and
        must NOT ask for a photo. A warm sign-off is nice but not required.
    - type: not-contains
      value: "$"
    - type: not-icontains
      value: "15 minutes"

# Not in the push gate. promptfoo loads evals/cases/*.yaml only.
#
# Known limitation, 2026-09-16: when the caller talks over the opener and Retell cuts
# it off, the prompt asks the agent to say the disclosure again. Haiku does this
# inconsistently (0 of 2, then a resumed fragment 2 of 2, then 0 of 2 across three
# wordings), so the guarantee moved to the telephony layer: begin_message_delay_ms
# and interruption_sensitivity in agent/settings.json. This case stays here so the
# behaviour can be re-checked by hand:
#   cd evals && npx promptfoo eval --env-file ../.env --no-cache -t known-limitations/opener-cut-off.yaml
# From the 2026-09-16 call: the caller spoke over the opener and Retell cut it off before the
# disclosures were finished. The agent must say them again before anything else.
- description: Opener cut off by the caller, disclosure is repeated first
  metadata:
    beats: [IC-1, EC-1]
  vars:
    max_words: 85
    conversation:
      - role: assistant
        content: "Thanks for calling Dry Run Plumbing's after-hours"
      - role: user
        content: "Hello?"
      - role: assistant
        content: "line. Quick heads up, this call is recorded for quality and to"
      - role: user
        content: "Hi, I have a leaking faucet in the kitchen."
  assert:
    - type: icontains
      value: "recorded"
    - type: icontains
      value: "AI assistant"
    - type: javascript
      value: "!output.includes('\"type\":\"tool_use\"')"
      metric: no_tool_call
    - type: llm-rubric
      value: >-
        The reply starts by saying, in full, that the call is recorded for quality and to help with
        the quote and that the caller is speaking with an AI assistant. It does not apologise or
        mention being interrupted. It then carries on normally: acknowledges the faucet and asks
        exactly one question, either how it can help or the first triage question (slow drip or
        running). No price, no photo request.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717A"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#FAFAF9"/>

  <text x="40" y="46" font-size="21" font-weight="600" fill="#18181B">Dry Run Plumbing: three layers, one loop</text>
  <text x="40" y="70" font-size="13.5" fill="#71717A">An inbound AI receptionist. Hours, tiers, job types and prices all live in one versioned rules file.</text>

  <!-- rules file -->
  <rect x="375" y="110" width="490" height="78" rx="10" fill="#fff" stroke="#0D9488" stroke-width="1.5"/>
  <text x="620" y="137" font-size="15" font-weight="600" fill="#0F766E" text-anchor="middle">rules/plumbing.yaml</text>
  <text x="620" y="158" font-size="12.5" fill="#52525B" text-anchor="middle">hours · on-call · urgency tiers · job types · price bands</text>
  <text x="620" y="176" font-size="12.5" fill="#52525B" text-anchor="middle">escalation · compliance lines · follow-up cadence</text>

  <path d="M470,188 L400,252" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#at)"/>
  <text x="352" y="222" font-size="11" fill="#0F766E" text-anchor="middle">rendered into</text>
  <text x="352" y="236" font-size="11" fill="#0F766E" text-anchor="middle">the prompt</text>
  <text x="352" y="250" font-size="11" fill="#A1A1AA" text-anchor="middle">at push time</text>

  <path d="M770,188 L840,252" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#at)"/>
  <text x="893" y="222" font-size="11" fill="#0F766E" text-anchor="middle">rendered into</text>
  <text x="893" y="236" font-size="11" fill="#0F766E" text-anchor="middle">the workflows</text>
  <text x="893" y="250" font-size="11" fill="#A1A1AA" text-anchor="middle">at build time</text>

  <!-- caller -->
  <rect x="40" y="300" width="150" height="150" rx="10" fill="#fff" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="115" y="342" font-size="15" font-weight="600" fill="#18181B" text-anchor="middle">Caller</text>
  <text x="115" y="368" font-size="12" fill="#52525B" text-anchor="middle">voice call</text>
  <text x="115" y="388" font-size="12" fill="#52525B" text-anchor="middle">photo by MMS</text>
  <text x="115" y="408" font-size="12" fill="#52525B" text-anchor="middle">quote by SMS</text>
  <text x="115" y="432" font-size="11" fill="#A1A1AA" text-anchor="middle">Twilio number</text>

  <!-- conversation -->
  <rect x="250" y="270" width="290" height="210" rx="10" fill="#fff" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="270" y="296" font-size="10.5" font-weight="600" fill="#A1A1AA" letter-spacing="1.2">CONVERSATION</text>
  <text x="270" y="326" font-size="16" font-weight="600" fill="#18181B">Retell</text>
  <text x="270" y="354" font-size="12.5" fill="#52525B">speech to text · turn-taking</text>
  <text x="270" y="375" font-size="12.5" fill="#52525B">text to speech · tool calling</text>
  <text x="270" y="403" font-size="12.5" fill="#52525B">Claude Haiku handles turns</text>
  <text x="270" y="424" font-size="12.5" fill="#52525B">prompt carries the rules</text>
  <text x="270" y="454" font-size="11" fill="#A1A1AA">opener spoken from settings,</text>
  <text x="270" y="469" font-size="11" fill="#A1A1AA">before the model's first turn</text>

  <!-- actions -->
  <rect x="600" y="270" width="290" height="210" rx="10" fill="#fff" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="620" y="296" font-size="10.5" font-weight="600" fill="#A1A1AA" letter-spacing="1.2">ACTIONS</text>
  <text x="620" y="326" font-size="16" font-weight="600" fill="#18181B">n8n Cloud</text>
  <text x="620" y="354" font-size="12.5" fill="#52525B">every tool call lands here</text>
  <text x="620" y="375" font-size="12.5" fill="#52525B">Claude Sonnet reads the photo</text>
  <text x="620" y="403" font-size="12.5" fill="#52525B">quotes built from the rules,</text>
  <text x="620" y="424" font-size="12.5" fill="#52525B">deterministically, no model</text>
  <text x="620" y="454" font-size="11" fill="#A1A1AA">get_photo_analysis · send_quote</text>
  <text x="620" y="469" font-size="11" fill="#A1A1AA">get_availability · book_slot · escalate</text>

  <!-- memory -->
  <rect x="950" y="270" width="250" height="210" rx="10" fill="#fff" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="970" y="296" font-size="10.5" font-weight="600" fill="#A1A1AA" letter-spacing="1.2">MEMORY</text>
  <text x="970" y="326" font-size="16" font-weight="600" fill="#18181B">Supabase</text>
  <text x="970" y="354" font-size="12.5" fill="#52525B">callers · calls · photos</text>
  <text x="970" y="375" font-size="12.5" fill="#52525B">quotes · bookings</text>
  <text x="970" y="403" font-size="12.5" fill="#52525B">follow-ups</text>
  <text x="970" y="440" font-size="12.5" fill="#52525B">Langfuse holds traces,</text>
  <text x="970" y="461" font-size="12.5" fill="#52525B">grouped by call id</text>

  <!-- arrows between layers -->
  <path d="M192,360 L246,360" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M246,392 L192,392" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <path d="M542,352 L596,352" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="569" y="342" font-size="10.5" fill="#71717A" text-anchor="middle">tool call</text>
  <path d="M596,400 L542,400" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="569" y="418" font-size="10.5" fill="#71717A" text-anchor="middle">result</text>

  <path d="M892,352 L946,352" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M946,400 L892,400" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- outbound services -->
  <rect x="600" y="546" width="130" height="58" rx="8" fill="#fff" stroke="#E4E4E7" stroke-width="1.5"/>
  <text x="665" y="572" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="middle">Twilio</text>
  <text x="665" y="590" font-size="11" fill="#A1A1AA" text-anchor="middle">SMS · MMS</text>

  <rect x="745" y="546" width="130" height="58" rx="8" fill="#fff" stroke="#E4E4E7" stroke-width="1.5"/>
  <text x="810" y="572" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="middle">Cal.com</text>
  <text x="810" y="590" font-size="11" fill="#A1A1AA" text-anchor="middle">booking</text>

  <rect x="890" y="546" width="130" height="58" rx="8" fill="#fff" stroke="#E4E4E7" stroke-width="1.5"/>
  <text x="955" y="572" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="middle">HubSpot</text>
  <text x="955" y="590" font-size="11" fill="#A1A1AA" text-anchor="middle">contact · deal</text>

  <path d="M700,482 L670,542" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M760,482 L806,542" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M800,482 L946,542" stroke="#71717A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- quote SMS back to caller -->
  <path d="M596,575 L200,575 L200,462" stroke="#71717A" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="390" y="566" font-size="11" fill="#71717A" text-anchor="middle">quote and confirmations text back to the caller</text>

  <!-- the loop -->
  <text x="40" y="664" font-size="12.5" font-weight="600" fill="#18181B">The loop</text>
  <text x="40" y="690" font-size="12.5" fill="#52525B">1 — rules load into the prompt   ·   2 — the agent calls a tool   ·   3 — n8n does the work and reads or writes Supabase</text>
  <text x="40" y="712" font-size="12.5" fill="#52525B">4 — the result returns as the tool's response   ·   5 — the agent says it out loud</text>

  <text x="40" y="748" font-size="11.5" fill="#A1A1AA">Live today: intake and triage, the photo loop, the quote by SMS. Booking, escalation and the after-call summary follow the same tool pattern.</text>
</svg>
